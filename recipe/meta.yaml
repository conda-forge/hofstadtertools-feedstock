{% set name = "HofstadterTools" %}
{% set version = "1.0.5" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | lower }}-{{ version }}.tar.gz
  sha256: 8f0a92a31e254098b12a408466cdbdda1ffc34d1eb7e9e46b085eb8ffe55bc57

build:
  entry_points:
    - band_structure = HT.band_structure:main
    - butterfly = HT.butterfly:main
    - plot_band_structure = HT.plot.plot_band_structure:main
    - plot_butterfly = HT.plot.plot_butterfly:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=61.0
    - pip
  run:
    - python >={{ python_min }}
    - numpy
    - matplotlib-base
    - prettytable
    - tqdm
    - pytest
    - ipython
    - jupyter
    - pyqt

test:
  commands:
    - pip check
    - pytest --pyargs HT
    - band_structure --help
    - butterfly --help
    - plot_band_structure --help
    - plot_butterfly --help
  requires:
    - pip
    - pytest
    - python {{ python_min }}

about:
  home: https://hofstadter.tools
  summary: A Python package for analyzing the Hofstadter model.
  description: HofstadterTools (HT) is a set of Python programs and classes for analyzing the Hofstadter model, which describes the behavior of non-interacting quantum particles hopping on a lattice coupled to a gauge field. This package can be used to compute the band structure of a generalized Hofstadter model on any
    regular Euclidean lattice, as well as its key properties, such as quantum geometry and topology.
  license: GPL-3.0-only
  license_family: GPL
  license_file: LICENSE
  doc_url: https://hofstadter.tools
  dev_url: https://github.com/HofstadterTools/HofstadterTools

extra:
  recipe-maintainers:
    - bartandrews
